; AI Monitor — firmware v0.2 para M5Stack CoreS3 (Stack-chan)
; Monitor de sessões de IA estilo Miblo, com o rosto da Nous-Girl.
; Toolchain: PlatformIO + Arduino + M5Unified (LovyanGFX).
;
; Compilar:  pio run
; ATENÇÃO: este firmware SUBSTITUI o Nous-Girl/XiaoZhi (voz e "Hey Jarvis").
; Antes de gravar, leia ../LEIA-ME.md (backup e restauração).

[platformio]
default_envs = m5stack-cores3

[env:m5stack-cores3]
platform = espressif32@8.0.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
; GIFs da Nous-Girl embutidos na flash (lidos em src/face.cpp).
board_build.embed_files =
    assets/nousgirl/neutral.gif
    assets/nousgirl/thinking.gif
    assets/nousgirl/happy.gif
    assets/nousgirl/listening.gif
    assets/nousgirl/sad.gif
    assets/nousgirl/sleeping.gif
    assets/nousgirl/look_left.gif
    assets/nousgirl/look_right.gif

; Versões fixas (reprodutível).
lib_deps =
    m5stack/M5Unified@0.3.0
    bblanchon/ArduinoJson@7.4.3
    links2004/WebSockets@2.7.3
    madhephaestus/ESP32Servo@3.2.1
    bitbank2/AnimatedGIF@2.2.3

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM

; ---------------------------------------------------------------------------
; LCDWiki ES3C28P — ESP32-S3 2.8" ILI9341V IPS + toque FT6336G + ES8311 (src/hw.cpp).
; Compilar:  pio run -e es3c28p      Gravar:  pio run -e es3c28p -t upload --upload-port COM6
[env:es3c28p]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
board_build.embed_files = ${env:m5stack-cores3.board_build.embed_files}
lib_deps = ${env:m5stack-cores3.lib_deps}
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DBOARD_ES3C28P
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
